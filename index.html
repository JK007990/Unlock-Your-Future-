<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSpark - All in One Ecosystem</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh; overflow-x: hidden; position: relative;
        }

        /* Background Animation */
        .background-animation { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; overflow: hidden; }
        .bubble { position: absolute; border-radius: 50%; background: linear-gradient(45deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15)); filter: blur(40px); animation: floatAround 20s infinite alternate ease-in-out; }
        .bubble:nth-child(1) { width: 400px; height: 400px; top: -10%; left: -10%; }
        .bubble:nth-child(2) { width: 500px; height: 500px; bottom: -10%; right: -10%; }
        @keyframes floatAround { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }

        /* Shared Glass Card Style */
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 32px; padding: 40px; box-shadow: 0 28px 50px rgba(31, 38, 135, 0.08); }
        .highlight { background: linear-gradient(45deg, #4f46e5, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }

        /* HOME PAGE STYLES */
        header { display: flex; justify-content: space-between; align-items: center; padding: 25px 5%; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; color: #4f46e5; cursor: pointer; }
        .logo i { font-size: 1.8rem; background: linear-gradient(45deg, #4f46e5, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav { display: flex; gap: 20px; align-items: center; }
        .nav-btn { text-decoration: none; color: #4b5563; font-weight: 600; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .nav-btn:hover { color: #4f46e5; background: rgba(255, 255, 255, 0.6); }
        .login-btn { background: #4f46e5; color: #fff !important; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }
        .hero-section { max-width: 1300px; margin: 0 auto; padding: 20px 5%; }
        .content-container { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
        
        /* Floating Animation Elements */
        .animation-container { display: flex; justify-content: center; align-items: center; }
        .edu-animation { position: relative; width: 300px; height: 300px; }
        .core-glow { position: absolute; width: 150px; height: 150px; background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, rgba(255,255,255,0) 70%); top: 25%; left: 25%; animation: pulse 3s infinite ease-in-out; }
        .floating-book, .floating-globe, .floating-pencil { position: absolute; background: white; padding: 20px; border-radius: 24px; font-size: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.05); animation: float 4s infinite ease-in-out; }
        .floating-book { top: 10%; left: 20%; color: #a855f7; }
        .floating-globe { bottom: 10%; left: 10%; color: #06b6d4; animation-delay: 1.3s; }
        .floating-pencil { top: 40%; right: 10%; color: #ec4899; animation-delay: 2.6s; }
        
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 0.8; } }

        .glass-card h1 { font-size: 3rem; font-weight: 800; color: #1f2937; line-height: 1.2; margin-bottom: 20px; }
        .glass-card p { color: #4b5563; font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }
        
        /* Buttons */
        .action-buttons { display: flex; flex-direction: column; gap: 15px; }
        .main-btn { display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.8); padding: 18px 25px; border-radius: 20px; font-size: 1.1rem; font-weight: 600; color: #374151; cursor: pointer; transition: all 0.3s ease; text-align: left; }
        .main-btn:hover { background: #4f46e5; color: white; transform: translateX(10px); }
        .main-btn i { color: #4f46e5; width: 24px; font-size: 1.2rem; }
        .main-btn:hover i { color: white; }

        @media (max-width: 968px) { .content-container { grid-template-columns: 1fr; text-align: center; } .main-btn { justify-content: center; } }
    </style>
</head>
<body>

    <!-- Background Bubble Animation -->
    <div class="background-animation">
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Navigation Header -->
    <header>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i><span>Unlock Your Future</span></div>
        <nav>
            <a class="nav-btn" href="./Home page/About Us page.html"  >About Us</a>
            <a class="nav-btn" href="./Home page/Contact Us.html"  >Contact Us</a>
            <a class="nav-btn login-btn" href="./Home page/Login page.html"   >Login</a>
        </nav>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <div class="content-container">
            <!-- Left Side Animation -->
            <div class="animation-container">
                <div class="edu-animation">
                    <div class="floating-book"><i class="fa-solid fa-book-open"></i></div>
                    <div class="floating-globe"><i class="fa-solid fa-globe"></i></div>
                    <div class="floating-pencil"><i class="fa-solid fa-pencil"></i></div>
                    <div class="core-glow"></div>
                </div>
            </div>
            
            <!-- Right Side Main Card -->
            <div class="glass-card">
                <h1>Unlock Your Future <br><span class="highlight">100% Free</span></h1>
                <p>Knowledge is power. Dive into our interactive ecosystem and learn without limits today!</p>
                <div class="action-buttons">
                    <button class="main-btn"><i class="fa-solid fa-layer-group"></i> Lessons Plan</button>
                    <button class="main-btn"><i class="fa-solid fa-laptop-code"></i> Program</button>
                    <button class="main-btn"><i class="fa-solid fa-comments"></i> Discussion</button>
                    <button class="main-btn"><i class="fa-solid fa-book"></i> Library</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
